[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bookcoder"
version = "2.1.0"
description = "BookCoder — Professional AI Audiobook Generator"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "BookCoder Contributors" }
]
classifiers = [
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "flask>=3.0",
  "edge-tts>=6.1",
  "ebooklib>=0.18",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "langdetect>=1.0.9",
  "pydub>=0.25",
  "mobi>=0.3",
  "piper-tts>=1.2.0",
]

[project.optional-dependencies]
# Additional/alternative TTS or processing backends can be added here in the future.
dev = [
  "pytest>=8.0",
]
mms = [
  "torch",
  "transformers>=4.41",
  "numpy",
  "scipy",
]
coqui = [
  "torch",
  "TTS>=0.22.0",
]
heavy-tts = [
  "torch",
  "transformers>=4.41",
  "numpy",
  "scipy",
  "TTS>=0.22.0",
]

[project.scripts]
bookcoder = "bookcoder.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["bookcoder*"]

[tool.setuptools.package-data]
"bookcoder.ui" = ["templates/*.html", "static/css/*.css", "static/js/*.js"]
