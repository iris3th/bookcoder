[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bookcoder"
version = "0.1.0"
description = "BookCoder — Professional AI Audiobook Generator"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "BookCoder Contributors" }
]
dependencies = [
  "flask>=3.0",
  "edge-tts>=6.1",
  "ebooklib>=0.18",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "langdetect>=1.0.9",
  "pydub>=0.25",
  "mobi>=0.3",
  "piper-tts>=1.2.0",
]

[project.optional-dependencies]
# Additional/alternative TTS or processing backends can be added here in the future.
dev = [
  "pytest>=8.0",
]

[project.scripts]
bookcoder = "bookcoder.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["bookcoder*"]

[tool.setuptools.package-data]
"bookcoder.ui" = ["templates/*.html", "static/css/*.css", "static/js/*.js"]
